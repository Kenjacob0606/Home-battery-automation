# write your Docker Compose configuration here
services:
  db-iot:
    image: mariadb:12
    environment:
      MARIADB_USER: iot
      MARIADB_PASSWORD: iotpw
      MARIADB_ROOT_PASSWORD: iamroot
      MARIADB_DATABASE: iotdb
    volumes:
      - mariadb_iot_data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'healthcheck.sh', '--su=mysql', '--connect', '--innodb_initialized' ]
      timeout: 10s
      retries: 3

  db-reactive:
    image: mariadb:12
    environment:
      MARIADB_USER: reactive
      MARIADB_PASSWORD: reactivepw
      MARIADB_ROOT_PASSWORD: iamroot
      MARIADB_DATABASE: reactivedb
    volumes:
      - mariadb_reactive_data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'healthcheck.sh', '--su=mysql', '--connect', '--innodb_initialized' ]
      timeout: 10s
      retries: 3

  kafka-0:
    image: apache/kafka:4.1.1
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      # Enabled JMX for kafka-ui - would need to be secured in a production environment
      JMX_PORT: 9997
    healthcheck:
      test: [ 'CMD-SHELL', 'unset JMX_PORT && /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1' ]
      timeout: 10s
      retries: 3

  kafka-1:
    image: apache/kafka:4.1.1
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      # Enabled JMX for kafka-ui - would need to be secured in a production environment
      JMX_PORT: 9997
    healthcheck:
      test: [ 'CMD-SHELL', 'unset JMX_PORT && /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1' ]
      timeout: 10s
      retries: 3

  kafka-2:
    image: apache/kafka:4.1.1
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      # Enabled JMX for kafka-ui - would need to be secured in a production environment
      JMX_PORT: 9997
    healthcheck:
      test: [ 'CMD-SHELL', 'unset JMX_PORT && /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1' ]
      timeout: 10s
      retries: 3

  iot:
    image: iot:latest
    ports:
      - 8080:8080
    environment:
      DATASOURCES_IOT_URL: jdbc:mariadb://db-iot/iotdb
      DATASOURCES_IOT_USERNAME: iot
      DATASOURCES_IOT_PASSWORD: iotpw
      KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
    depends_on:
      db-iot:
        condition: service_healthy
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'curl', '--fail', 'http://localhost:8080/health' ]
      timeout: 10s
      retries: 3

  reactive:
    image: reactive:latest
    ports:
      - 8081:8081
    environment:
      DATASOURCES_REACTIVE_URL: jdbc:mariadb://db-reactive/reactivedb
      DATASOURCES_REACTIVE_USERNAME: reactive
      DATASOURCES_REACTIVE_PASSWORD: reactivepw
      KAFKA_BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
      IOTM_URL: http://iot:8080
    depends_on:
      db-reactive:
        condition: service_healthy
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      iot:
          condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'curl', '--fail', 'http://localhost:8081/health' ]
      timeout: 10s
      retries: 3

