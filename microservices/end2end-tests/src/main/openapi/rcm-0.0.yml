openapi: 3.0.1
info:
  title: reactive
  version: "0.0"
paths:
  /components:
    get:
      tags:
        - components
      operationId: list
      responses:
        "200":
          description: list 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Component"
  /topic-slots:
    get:
      tags:
        - topic-slots
      operationId: list
      responses:
        "200":
          description: list_1 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSlot"
components:
  schemas:
    Component:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
    TopicSlot:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        topicName:
          type: string
        slotName:
          type: string
        slotType:
          type: string
        timestampValue:
          type: string
          format: date-time
        textValue:
          type: string
        doubleValue:
          type: number
          format: double
        longValue:
          type: integer
          format: int64